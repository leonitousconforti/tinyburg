name: Deploy staging

# After CI passes on a push to main, or by hand. workflow_run always runs this file as it is on main, so a pull request
# cannot change what the deploy job does.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: ["main"]
  workflow_dispatch:

# One deploy at a time, never cancelled halfway: a newer push waits, and
# replaces any older deploy still waiting.
concurrency:
  group: deploy-staging
  cancel-in-progress: false

permissions: {}

jobs:
  deploy:
    # The branch filter above also matches a fork's pull request from a branch
    # named main, so check that this was a push to this repository.
    if: >-
      github.ref == 'refs/heads/main' && (
        github.event_name == 'workflow_dispatch' || (
          github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.event == 'push' &&
          github.event.workflow_run.head_branch == 'main' &&
          github.event.workflow_run.head_repository.full_name == github.repository
        )
      )
    # The runner is the staging box itself.
    runs-on: [self-hosted, staging]
    timeout-minutes: 30
    environment:
      name: staging
      url: https://staging.tinyburg.app
    env:
      SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
      REPOSITORY: ${{ github.repository }}
      # Decrypts secrets/staging.env (see .sops.yaml).
      SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
    steps:
      # The runner is root, and Postgres refuses root, so the stack runs as the
      # ordinary user tinyburg, as a system service from a checkout that user
      # owns. Its .env, node_modules and Postgres data (.dev) live there and
      # survive between deploys. Root only builds, decrypts and restarts.
      - name: Deploy
        run: |
          export PATH="/nix/var/nix/profiles/default/bin:$HOME/.nix-profile/bin:$PATH"
          nix() { command nix --extra-experimental-features 'nix-command flakes' "$@"; }

          if [ "$(id -u)" != 0 ]; then
            echo "::error::the runner must run as root: it installs a system service and the user that service runs as"
            exit 1
          fi
          if [ -z "$SOPS_AGE_KEY" ]; then
            echo "::error::set the SOPS_AGE_KEY secret in the staging environment"
            exit 1
          fi

          user=tinyburg
          home=/var/lib/tinyburg
          dir="$home/staging"
          id "$user" > /dev/null 2>&1 ||
            useradd --system --create-home --home-dir "$home" --shell /usr/sbin/nologin "$user"
          # A clean environment, so neither SOPS_AGE_KEY nor the runner's tokens
          # reach what tinyburg runs (pnpm's install scripts, say).
          as() { runuser -u "$user" -- env -i HOME="$home" PATH="${tools:-$PATH}" CI=true "$@"; }

          # The first deploys ran the stack as root's own user service.
          if [ -e /root/.config/systemd/user/tinyburg-staging.service ]; then
            XDG_RUNTIME_DIR=/run/user/0 systemctl --user disable --now tinyburg-staging || true
            rm -rf /root/.config/systemd/user/tinyburg-staging.service /root/tinyburg-staging
          fi

          [ -d "$dir/.git" ] || as git clone --quiet "https://github.com/$REPOSITORY.git" "$dir"
          cd "$dir"
          as git fetch --quiet origin main
          if ! as git merge-base --is-ancestor "$SHA" origin/main; then
            echo "::error::$SHA is not on main"
            exit 1
          fi
          deployed=$(cat .git/staging-deployed 2>/dev/null || true)
          if [ -n "$deployed" ] && [ "$deployed" != "$SHA" ] && as git merge-base --is-ancestor "$SHA" "$deployed"; then
            echo "$deployed, which is newer, is already deployed"
            exit 0
          fi

          # Build everything the new commit needs while the old stack still
          # serves, so the stack is down only for the restart. Root builds from
          # the commit on GitHub; the result is world-readable, so tinyburg
          # needs no nix of its own. The -o link keeps it from garbage collection.
          echo "::group::build the stack and the dev shell at $SHA"
          flake="github:$REPOSITORY/$SHA"
          stack=$(nix build --print-out-paths -o "$home/staging-stack" "$flake#staging")
          # shellcheck disable=SC2016 # the dev shell's $PATH, expanded inside it
          tools=$(nix develop "$flake" --command bash -c 'printf %s "$PATH"')
          echo "::endgroup::"

          cat > /etc/systemd/system/tinyburg-staging.service <<EOF
          [Unit]
          Description=Tinyburg staging stack (staging.tinyburg.app)
          Wants=network-online.target
          After=network-online.target

          [Service]
          User=$user
          WorkingDirectory=$dir
          ExecStart=$stack/bin/staging --tui=false
          Restart=on-failure
          RestartSec=10

          [Install]
          WantedBy=multi-user.target
          EOF
          systemctl daemon-reload
          systemctl enable --quiet tinyburg-staging
          systemctl stop tinyburg-staging

          as git checkout --quiet --force --detach "$SHA"
          (umask 077 && PATH="$tools" sops decrypt secrets/staging.env > .env)
          chown "$user:" .env
          as env COREPACK_ENABLE_DOWNLOAD_PROMPT=0 pnpm install --frozen-lockfile
          echo "$SHA" > .git/staging-deployed
          systemctl start tinyburg-staging

          # Up means every public app answers http, whatever the status (the
          # treasury has no page at /).
          for port in 3000 3001 3002 3004; do
            for attempt in $(seq 60); do
              curl --silent --output /dev/null --max-time 5 "http://127.0.0.1:$port/" && break
              if [ "$attempt" = 60 ]; then
                echo "::error::port $port did not come up in 5 minutes; the stack's log follows"
                journalctl --unit tinyburg-staging --no-pager --lines 200
                exit 1
              fi
              echo "waiting for port $port ($attempt/60)"
              sleep 5
            done
          done
          echo "deployed $SHA"
