name: Deploy staging

# After CI passes on a push to main, or by hand. workflow_run always runs this file as it is on main, so a pull request
# cannot change what the deploy job does.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: ["main"]
  workflow_dispatch:

# One deploy at a time, never cancelled halfway: a newer push waits, and
# replaces any older deploy still waiting.
concurrency:
  group: deploy-staging
  cancel-in-progress: false

permissions: {}

jobs:
  deploy:
    # The branch filter above also matches a fork's pull request from a branch
    # named main, so check that this was a push to this repository.
    if: >-
      github.ref == 'refs/heads/main' && (
        github.event_name == 'workflow_dispatch' || (
          github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.event == 'push' &&
          github.event.workflow_run.head_branch == 'main' &&
          github.event.workflow_run.head_repository.full_name == github.repository
        )
      )
    # The runner is the staging box itself.
    runs-on: [self-hosted, staging]
    timeout-minutes: 30
    environment:
      name: staging
      url: https://staging.tinyburg.app
    env:
      SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
      REPOSITORY: ${{ github.repository }}
      # Decrypts secrets/staging.env (see .sops.yaml).
      SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
    steps:
      # The stack outlives the job as a systemd user service, run from a
      # checkout outside the runner's workspace so its .env, node_modules and
      # Postgres data (.dev) survive between deploys.
      - name: Deploy
        run: |
          export PATH="/nix/var/nix/profiles/default/bin:$HOME/.nix-profile/bin:$PATH"
          XDG_RUNTIME_DIR="/run/user/$(id -u)"
          export XDG_RUNTIME_DIR
          nix() { command nix --extra-experimental-features 'nix-command flakes' "$@"; }

          if [ "$(id -u)" = 0 ]; then
            echo "::error::the runner runs as root, and Postgres refuses to: run it as an ordinary user (./svc.sh install <user>) with lingering"
            exit 1
          fi
          if ! loginctl show-user "$(id -un)" --property=Linger | grep -q yes; then
            echo "::error::the stack runs as a user service, so the runner's user needs lingering: sudo loginctl enable-linger $(id -un)"
            exit 1
          fi
          if [ -z "$SOPS_AGE_KEY" ]; then
            echo "::error::set the SOPS_AGE_KEY secret in the staging environment"
            exit 1
          fi

          dir="$HOME/tinyburg-staging"
          [ -d "$dir/.git" ] || git clone --quiet "https://github.com/$REPOSITORY.git" "$dir"
          cd "$dir"
          git fetch --quiet origin main
          if ! git merge-base --is-ancestor "$SHA" origin/main; then
            echo "::error::$SHA is not on main"
            exit 1
          fi
          deployed=$(cat .git/staging-deployed 2>/dev/null || true)
          if [ -n "$deployed" ] && [ "$deployed" != "$SHA" ] && git merge-base --is-ancestor "$SHA" "$deployed"; then
            echo "$deployed, which is newer, is already deployed"
            exit 0
          fi

          # Build everything the new commit needs while the old stack still
          # serves, so the stack is down only for the restart.
          echo "::group::build the stack and the dev shell at $SHA"
          nix build --no-link "git+file://$dir?rev=$SHA#staging"
          nix develop "git+file://$dir?rev=$SHA" --command true
          echo "::endgroup::"

          mkdir -p ~/.config/systemd/user
          cat > ~/.config/systemd/user/tinyburg-staging.service <<EOF
          [Unit]
          Description=Tinyburg staging stack (staging.tinyburg.app)
          Wants=network-online.target
          After=network-online.target

          [Service]
          WorkingDirectory=$dir
          ExecStart=$(type -P nix) --extra-experimental-features 'nix-command flakes' run .#staging -- --tui=false
          Restart=on-failure
          RestartSec=10

          [Install]
          WantedBy=default.target
          EOF
          systemctl --user daemon-reload
          systemctl --user enable --quiet tinyburg-staging
          systemctl --user stop tinyburg-staging

          git checkout --quiet --force --detach "$SHA"
          (umask 077 && nix develop --command sops decrypt secrets/staging.env > .env)
          COREPACK_ENABLE_DOWNLOAD_PROMPT=0 nix develop --command pnpm install --frozen-lockfile
          echo "$SHA" > .git/staging-deployed
          systemctl --user start tinyburg-staging

          # Up means every public app answers http, whatever the status (the
          # treasury has no page at /).
          for port in 3000 3001 3002 3004; do
            for attempt in $(seq 60); do
              curl --silent --output /dev/null --max-time 5 "http://127.0.0.1:$port/" && break
              if [ "$attempt" = 60 ]; then
                echo "::error::port $port did not come up in 5 minutes; the stack's log follows"
                journalctl --user --unit tinyburg-staging --no-pager --lines 200
                exit 1
              fi
              echo "waiting for port $port ($attempt/60)"
              sleep 5
            done
          done
          echo "deployed $SHA"
