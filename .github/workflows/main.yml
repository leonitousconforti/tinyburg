name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 24

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6

      - run: pnpm install
      - run: pnpm clean
      - run: pnpm codegen
      - run: pnpm docgen
      - run: git add packages/**/src && git diff-index --cached HEAD --exit-code packages/**/src
      - run: pnpm check
      - run: pnpm circular
      - run: pnpm lint
      - run: pnpm build
      - run: touch ./.env
      - run: pnpm test
        env:
          NIMBLEBIT_AUTH_KEY: ${{ secrets.NIMBLEBIT_AUTH_KEY }}

  deploy-archivist:
    name: Deploy Archivist
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Install doctl
        uses: digitalocean/action-doctl@135ac0aa0eed4437d547c6f12c364d3006b42824 # v2.5.1
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
      - name: Deploy to DigitalOcean App Platform
        run: |
          APP_ID=$(doctl apps list --format ID,Spec.Name --no-header | awk '$2 == "archivist" {print $1}')
          doctl apps create-deployment "$APP_ID" --wait

  deploy-authproxy:
    name: Deploy Authproxy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Install doctl
        uses: digitalocean/action-doctl@135ac0aa0eed4437d547c6f12c364d3006b42824 # v2.5.1
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
      - name: Deploy to DigitalOcean App Platform
        run: |
          APP_ID=$(doctl apps list --format ID,Spec.Name --no-header | awk '$2 == "authproxy" {print $1}')
          doctl apps create-deployment "$APP_ID" --wait

  deploy-auto-gold-bits:
    name: Deploy Auto Gold Bits
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Install doctl
        uses: digitalocean/action-doctl@135ac0aa0eed4437d547c6f12c364d3006b42824 # v2.5.1
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
      - name: Deploy to DigitalOcean App Platform
        run: |
          APP_ID=$(doctl apps list --format ID,Spec.Name --no-header | awk '$2 == "auto-gold-bits" {print $1}')
          doctl apps create-deployment "$APP_ID" --wait

  deploy-tinyburg:
    name: Deploy Tinyburg
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Install doctl
        uses: digitalocean/action-doctl@135ac0aa0eed4437d547c6f12c364d3006b42824 # v2.5.1
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
      - name: Deploy to DigitalOcean App Platform
        run: |
          APP_ID=$(doctl apps list --format ID,Spec.Name --no-header | awk '$2 == "tinyburg" {print $1}')
          doctl apps create-deployment "$APP_ID" --wait
