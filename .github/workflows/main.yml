name: CI

on:
  push:
    branches: ["main", "renovate/**"]
  pull_request:
    branches: ["main"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 26
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6

      - run: pnpm install
      - run: pnpm clean
      - run: pnpm codegen
      - run: pnpm build
      - run: pnpm docgen
      - run: git add packages/*/src && git diff-index --cached HEAD --exit-code packages/*/src
      - run: pnpm check
      - run: pnpm circular
      - run: pnpm lint
      - run: touch ./.env
      - run: pnpm test
        env:
          NIMBLEBIT_AUTH_KEY: ${{ secrets.NIMBLEBIT_AUTH_KEY }}
