hoist: false
hoistPattern: []
autoInstallPeers: false
strictPeerDependencies: true
publicHoistPattern:
  - "vitest"
  - "@types/*"
  - "@vitest/*"
  - "@effect/vitest"

recursiveInstall: true
dedupePeerDependents: false
linkWorkspacePackages: true
hoistWorkspacePackages: false
preferWorkspacePackages: true
resolvePeersFromWorkspaceRoot: false

packages:
  - apps/*
  - packages/*
  - scratchpad

allowBuilds:
  '@parcel/watcher': true
  esbuild: true
  frida: true
  msgpackr-extract: true
  sharp: true

overrides:
  "@effect/docgen>typescript": "7.0.2"
  "madge>typescript": "7.0.2"

peerDependencyRules:
  allowedVersions:
    typescript: "7.0.2"
    "@babel/core": "8.0.1"
    # These still pin effect 4.0.0-beta.104, remove once they catch up to beta.105
    "effect-oidc>effect": "4.0.0-beta.105"
    "@efffrida/frida-tools>effect": "4.0.0-beta.105"
    "@efffrida/gplayapi>effect": "4.0.0-beta.105"
    "@efffrida/il2cpp-bridge>effect": "4.0.0-beta.105"
    "@efffrida/platform>effect": "4.0.0-beta.105"
    "@efffrida/rpc>effect": "4.0.0-beta.105"

minimumReleaseAgeExclude:
  - "effect-oidc"
  - "@efffrida/*"
  - "@effect/*"
  - "effect"
  - "@foldkit/*"
  - "foldkit"
