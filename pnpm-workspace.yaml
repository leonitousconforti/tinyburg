hoist: false
hoistPattern: []
autoInstallPeers: false
strictPeerDependencies: true
publicHoistPattern:
  - "vitest"
  - "@types/*"
  - "@vitest/*"
  - "@effect/vitest"

recursiveInstall: true
dedupePeerDependents: false
linkWorkspacePackages: true
hoistWorkspacePackages: false
preferWorkspacePackages: true
resolvePeersFromWorkspaceRoot: false

packages:
  - apps/*
  - packages/*
  - scratchpad

allowBuilds:
  frida: true

overrides:
  "@effect/docgen>typescript": "7.0.2"
  "madge>typescript": "7.0.2"

peerDependencyRules:
  ignoreMissing:
    - tsx

  # Ranges, so that Renovate's bumps don't break the lockfile update
  allowedVersions:
    typescript: "7"
    "@babel/core": "8"

minimumReleaseAgeExclude:
  - "@yielded/*"
  - "@efffrida/*"
  - "@effect/*"
  - "effect"
  - "@foldkit/*"
  - "foldkit"
  - frida

# effect and vitest: Frida's V8 runtime is built without ICU, so regexes using
# `\p{...}` fail to compile inside agents (copied from efffrida). Drop these
# once https://github.com/frida/frida-gum/issues/1195 is resolved.
patchedDependencies:
  "@yielded/jose@0.1.0-beta.47": patches/@yielded__jose@0.1.0-beta.47.patch
  "@yielded/oauth@0.1.0-beta.47": patches/@yielded__oauth@0.1.0-beta.47.patch
  effect@4.1.2: patches/effect@4.1.2.patch
  vitest@5.1.0: patches/vitest@5.1.0.patch
