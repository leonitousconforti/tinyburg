hoist: false
hoistPattern: []
autoInstallPeers: false
strictPeerDependencies: true
publicHoistPattern:
  - "vitest"
  - "@types/*"
  - "@vitest/*"
  - "@effect/vitest"

recursiveInstall: true
dedupePeerDependents: false
linkWorkspacePackages: true
hoistWorkspacePackages: false
preferWorkspacePackages: true
resolvePeersFromWorkspaceRoot: false

packages:
  - apps/*
  - packages/*
  - scratchpad

allowBuilds:
  '@parcel/watcher': true
  esbuild: true
  frida: true
  msgpackr-extract: true
  sharp: true

overrides:
  "@effect/docgen>typescript": "7.0.2"
  "madge>typescript": "7.0.2"

peerDependencyRules:
  allowedVersions:
    typescript: "7.0.2"
    "@babel/core": "8.0.1"

minimumReleaseAgeExclude:
  - "@yielded/*"
  - "@efffrida/*"
  - "@effect/*"
  - "effect"
  - "@foldkit/*"
  - "foldkit"

patchedDependencies:
  "@yielded/jose@0.1.0-beta.47": patches/@yielded__jose@0.1.0-beta.47.patch
  "@yielded/oauth@0.1.0-beta.47": patches/@yielded__oauth@0.1.0-beta.47.patch
