hoist: false
hoistPattern: []
autoInstallPeers: false
strictPeerDependencies: true
publicHoistPattern:
  - "vitest"
  - "@types/*"
  - "@vitest/*"
  - "@effect/vitest"

recursiveInstall: true
dedupePeerDependents: false
linkWorkspacePackages: true
hoistWorkspacePackages: false
preferWorkspacePackages: true
resolvePeersFromWorkspaceRoot: false

packages:
  - apps/*
  - packages/*
  - scratchpad

allowBuilds:
  '@parcel/watcher': true
  esbuild: true
  frida: true
  msgpackr-extract: true
  sharp: true

overrides:
  "@effect/docgen>typescript": "7.0.2"
  "madge>typescript": "7.0.2"

peerDependencyRules:
  # Ranges, so that Renovate's bumps don't break the lockfile update
  allowedVersions:
    typescript: "7"
    "@babel/core": "8"
    "@efffrida/frida-tools>effect": "4"
    "@efffrida/gplayapi>effect": "4"
    "@efffrida/il2cpp-bridge>effect": "4"
    "@efffrida/platform>effect": "4"
    "@efffrida/polyfills>effect": "4"
    "@efffrida/rpc>effect": "4"

minimumReleaseAgeExclude:
  - "@yielded/*"
  - "@efffrida/*"
  - "@effect/*"
  - "effect"
  - "@foldkit/*"
  - "foldkit"
  - frida

patchedDependencies:
  "@yielded/jose@0.1.0-beta.47": patches/@yielded__jose@0.1.0-beta.47.patch
  "@yielded/oauth@0.1.0-beta.47": patches/@yielded__oauth@0.1.0-beta.47.patch
